# fly.toml app configuration file generated for image2-web on 2026-07-05T18:13:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'image2-web'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['app']
  size = 'shared-cpu-1x'
